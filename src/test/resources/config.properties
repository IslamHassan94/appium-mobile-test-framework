# Execution target: local (Appium server + emulator) or browserstack
run.on=local
appium.url=http://127.0.0.1:4723

# Device
platform.name=Android
device.name=Android Emulator
platform.version=14
automation.name=UiAutomator2
app.path=apps/android/Android-MyDemoAppRN.1.3.0.build-244.apk
app.package=com.saucelabs.mydemoapp.rn
app.activity=.MainActivity

# Timeouts (seconds)
explicit.wait=15
new.command.timeout=120

# BrowserStack (credentials come from BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY env vars)
browserstack.app=
browserstack.device=Google Pixel 8
browserstack.os.version=14.0
